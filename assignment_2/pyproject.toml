[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pimiim-clinical-mcp"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx2>=2.10,<3",
    "pydantic>=2,<3",
    "streamlit>=1.45,<2",
]

[tool.setuptools.packages.find]
include = ["clinical_mcp*"]
